---
name: SkyEar
version: "0.2.9"
slug: skyear
description: >-
  Listen to a security camera's microphone and detect aircraft,
  checked against live ADS-B
url: https://github.com/MrUnluckyy/skyear
# No armv7: numpy publishes no wheel for 32-bit ARM. This covers Home Assistant
# Green and Yellow, a Raspberry Pi 4 or 5 on 64-bit OS, Intel boxes and VMs.
arch:
  - aarch64
  - amd64
image: ghcr.io/mrunluckyy/skyear-agent-{arch}
startup: application
boot: auto

# The agent has its own entrypoint and manages its own threads.
init: false

# The setup page appears in the Home Assistant sidebar, so there is no address
# to find and no port to open. Configuration happens there rather than in
# add-on options: a camera password belongs on the device, and add-on options
# are stored by the Supervisor.
ingress: true
ingress_port: 8088
panel_icon: mdi:ear-hearing
panel_title: SkyEar
